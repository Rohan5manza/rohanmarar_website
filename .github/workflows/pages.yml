name: Sync Substack and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Sync public Substack posts
        run: python3 scripts/sync_substack.py
      - name: Save new posts in the repository
        run: |
          git add site/substack-feed.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update public Substack articles"
            if ! git push origin HEAD:main; then
              echo "::warning::Feed could not be saved to the branch. This deployment will still include it; check repository workflow permissions or branch protection."
            fi
          fi
      - name: Build static website
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
